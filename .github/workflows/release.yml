name: Build release app

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check app
        run: swift test --disable-sandbox
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Verify app
        run: |
          test "$(lipo -archs dist/Teum.app/Contents/MacOS/Teum)" = arm64
          plutil -lint dist/Teum.app/Contents/Info.plist
          codesign --verify --strict dist/Teum.app
      - name: Package app
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Teum.app "dist/Teum-${TAG#v}-macos-arm64.zip"
      - name: Attach app to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/Teum-*-macos-arm64.zip --clobber
