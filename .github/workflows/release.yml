name: Build release app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the app to
        required: true
        default: v0.1.0-preview.1

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift version
        run: swift --version
      - name: Check app
        run: swift test --disable-sandbox
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Verify app
        run: |
          test "$(lipo -archs dist/Teum.app/Contents/MacOS/Teum)" = arm64
          plutil -lint dist/Teum.app/Contents/Info.plist
          codesign --verify --strict dist/Teum.app
      - name: Package app
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Teum.app "dist/Teum-${TAG#v}-macos-arm64.zip"
      - name: Attach app to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/Teum-*-macos-arm64.zip --clobber
